name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Verify tag matches plugin version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version .codex-plugin/plugin.json)"
      - uses: actions/download-artifact@v4
        with:
          name: goldilocks-release-assets
          path: bin/
      - name: Verify release artifacts against pinned checksums
        run: cd bin && sha256sum --check ../scripts/SHA256SUMS
      - name: Publish binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bin/goldilocks-* bin/SHA256SUMS --verify-tag --generate-notes
