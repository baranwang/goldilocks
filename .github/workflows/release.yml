name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RELEASE to publish the version from main
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          cache: false
      - name: Confirm release
        env:
          RELEASE_CONFIRM: ${{ inputs.confirm }}
        run: test "$RELEASE_CONFIRM" = "RELEASE"
      - name: Read and validate version
        shell: bash
        run: |
          version=$(jq -r .version .codex-plugin/plugin.json)
          manifest=$(jq -r '."."' .release-please-manifest.json)
          test -n "$version" && test "$version" = "$manifest"
          echo "GOLDILOCKS_VERSION=$version" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "tag v$version already exists" >&2
            exit 1
          fi
      - run: go test ./... -count=1
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.1
          args: release --snapshot --clean
        env:
          GOLDILOCKS_VERSION: ${{ env.GOLDILOCKS_VERSION }}
      - run: go run ./scripts/verify.go
      - name: Create release tag
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "v$GOLDILOCKS_VERSION" -m "Release v$GOLDILOCKS_VERSION"
          git push origin "v$GOLDILOCKS_VERSION"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOLDILOCKS_VERSION: ${{ env.GOLDILOCKS_VERSION }}
