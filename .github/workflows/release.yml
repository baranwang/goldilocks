name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          cache: false
      - name: Verify tag matches plugin version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version .codex-plugin/plugin.json)"
      - run: go test ./...
      - run: go run ./scripts/build.go
      - name: Verify pinned checksums before publishing
        run: git diff --exit-code -- scripts/SHA256SUMS
      - name: Publish binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bin/goldilocks-* bin/SHA256SUMS --verify-tag --generate-notes
