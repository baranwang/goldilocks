name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          cache: false
      - name: Read and validate version
        shell: bash
        run: |
          version=$(jq -r .version .codex-plugin/plugin.json)
          manifest=$(jq -r '."."' .release-please-manifest.json)
          test -n "$version" && test "$version" = "$manifest"
          test "v$version" = "$GITHUB_REF_NAME"
          echo "GOLDILOCKS_VERSION=$version" >> "$GITHUB_ENV"
      - run: go test ./... -count=1
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.1
          args: release --snapshot --clean
        env:
          GOLDILOCKS_VERSION: ${{ env.GOLDILOCKS_VERSION }}
      - run: go run ./scripts/verify.go
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOLDILOCKS_VERSION: ${{ env.GOLDILOCKS_VERSION }}
